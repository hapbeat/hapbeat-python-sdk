name: Publish to PyPI

# Publishes the `hapbeat-python-sdk` package via GitHub Actions OIDC (Trusted
# Publishing, no token stored in the repo). Mirrors hapbeat-helper's setup.
# (Distribution name is hapbeat-python-sdk; the import package stays `hapbeat`.)
#
# Triggers:
#   - tag push vX.Y.Z          -> production PyPI
#   - tag push vX.Y.Z-rcN/aN   -> TestPyPI (prerelease, contains "-" ... see note)
#   - workflow_dispatch        -> choose testpypi / pypi
#
# One-time PyPI setup (do once, BEFORE the first tag):
#   1. https://pypi.org/manage/account/publishing/  -> "Add a pending publisher"
#        PyPI Project Name: hapbeat-python-sdk
#        Owner:             hapbeat
#        Repository name:   hapbeat-python-sdk
#        Workflow filename: publish.yml
#        Environment name:  pypi
#   2. Same at https://test.pypi.org/manage/account/publishing/ with Environment: testpypi
#   3. GitHub repo Settings -> Environments -> create `pypi` and `testpypi`.
#
# DO NOT tag until the SDK is verified on a real Hapbeat device.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Upload target'
        required: true
        default: 'testpypi'
        type: choice
        options: [testpypi, pypi]
  push:
    tags: ['v*']

jobs:
  build:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install + test (publish gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') ||
      (github.event_name == 'push' && contains(github.ref, '-'))
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hapbeat-python-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') ||
      (github.event_name == 'push' && !contains(github.ref, '-'))
    environment:
      name: pypi
      url: https://pypi.org/p/hapbeat-python-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

      # 公開直後に devtools-site の release feed を再生成させる (DEC-053)。
      # feed は「実際に PyPI に上がっている版」を載せる仕様なので、publish の
      # *後* でなければ意味がない。CDN 反映に少し間があるので待ってから叩く。
      # 取り逃しても次の devtools-site ビルドで拾えるため best-effort。
      - name: Notify devtools-site (release feed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_SITE_DISPATCH_TOKEN is not set; skipping dispatch."
            exit 0
          fi
          sleep 60
          gh api repos/Hapbeat/hapbeat-devtools-site/dispatches \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -f event_type=release-published \
            -f "client_payload[source_repo]=${{ github.repository }}" \
            -f "client_payload[ref]=${{ github.ref_name }}"
