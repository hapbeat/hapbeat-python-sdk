name: Publish to PyPI

# Publishes the `hapbeat-python-sdk` package via GitHub Actions OIDC (Trusted
# Publishing, no token stored in the repo). Mirrors hapbeat-helper's setup.
# (Distribution name is hapbeat-python-sdk; the import package stays `hapbeat`.)
#
# Triggers:
#   - tag push vX.Y.Z          -> production PyPI
#   - tag push vX.Y.Z-rcN/aN   -> TestPyPI (prerelease, contains "-" ... see note)
#   - workflow_dispatch        -> choose testpypi / pypi
#
# One-time PyPI setup (do once, BEFORE the first tag):
#   1. https://pypi.org/manage/account/publishing/  -> "Add a pending publisher"
#        PyPI Project Name: hapbeat-python-sdk
#        Owner:             hapbeat
#        Repository name:   hapbeat-python-sdk
#        Workflow filename: publish.yml
#        Environment name:  pypi
#   2. Same at https://test.pypi.org/manage/account/publishing/ with Environment: testpypi
#   3. GitHub repo Settings -> Environments -> create `pypi` and `testpypi`.
#
# DO NOT tag until the SDK is verified on a real Hapbeat device.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Upload target'
        required: true
        default: 'testpypi'
        type: choice
        options: [testpypi, pypi]
  push:
    tags: ['v*']

jobs:
  build:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install + test (publish gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') ||
      (github.event_name == 'push' && contains(github.ref, '-'))
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hapbeat-python-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') ||
      (github.event_name == 'push' && !contains(github.ref, '-'))
    environment:
      name: pypi
      url: https://pypi.org/p/hapbeat-python-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
